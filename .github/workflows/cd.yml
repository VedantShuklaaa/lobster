name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# id-token lets this job exchange GitHub's signed token for short-lived AWS credentials (no stored keys)
permissions:
  contents: read
  id-token: write

# one deploy at a time; a running deploy is never cancelled halfway
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # only after CI passed on a push to main, or when started by hand
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    # same OS family as the instance (Ubuntu 24.04), so glibc matches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --workspace --release --bins

      - name: Stage release
        run: |
          mkdir stage
          for b in stress dispatch latency replay pipeline pipeline_latency lobster-server; do
            cp "target/release/$b" stage/
          done
          cp deploy/run-bench.sh deploy/setup-ec2.sh deploy/harden-ec2.sh \
             deploy/lobster-server.service deploy/Caddyfile stage/
          echo "$SHA" > stage/COMMIT
          tar -czf release.tgz -C stage .
          sha256sum release.tgz | cut -d' ' -f1 > release.sha256

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload release
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: |
          aws s3 cp release.tgz "s3://$BUCKET/releases/$SHA.tgz" --no-progress
          url=$(aws s3 presign "s3://$BUCKET/releases/$SHA.tgz" --expires-in 600)
          echo "::add-mask::$url"
          echo "URL=$url" >> "$GITHUB_ENV"

      # The instance has no inbound ports for this: SSM's agent on the box polls AWS and runs the script.
      - name: Install on the instance
        env:
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          sum=$(cat release.sha256)
          script=$(base64 -w0 deploy/remote-deploy.sh)
          jq -n --arg s "$script" --arg u "$URL" --arg h "$sum" --arg c "$SHA" \
            '{commands: [("f=$(mktemp) && echo " + $s + " | base64 -d > \"$f\" && bash \"$f\" " + ($u|@sh) + " " + $h + " " + $c)]}' \
            > params.json
          cid=$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript --comment "lobster deploy ${SHA::7}" \
            --timeout-seconds 300 --parameters file://params.json \
            --query Command.CommandId --output text)
          st=Pending
          for _ in $(seq 1 90); do
            st=$(aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE" \
                   --query Status --output text 2>/dev/null || echo Pending)
            case $st in Success|Failed|TimedOut|Cancelled|Cancelling) break ;; esac
            sleep 4
          done
          echo "status: $st"
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE" \
            --query StandardErrorContent --output text >&2 || true
          [ "$st" = Success ]